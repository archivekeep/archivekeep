id: org.archivekeep.ArchiveKeep

runtime: org.freedesktop.Platform
runtime-version: '26.08'

sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

finish-args:
  - --socket=x11
  - --device=dri
  - --share=network
  - --share=ipc
  # access to /dev/disk/by-uuid/ and /dev/mapper/ needed for disk UUID resolution
  - --device=all
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --env=PATH=/usr/bin:/app/bin:/app/jre/bin
  - --env=JAVA_HOME=/app/jre
  - --env=LD_LIBRARY_PATH=/app/lib:/app/bin
  - --env=OBJECTBOX_NATIVE_LIB_DIR=/app/lib

command: archivekeep-desktop

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: archivekeep-desktop
    buildsystem: simple
    build-options:
      append-path: "/usr/lib/sdk/openjdk21/bin"
    build-commands:
      - "sed -i s/distributionUrl.*/distributionUrl=gradle-bin.zip/ gradle/wrapper/gradle-wrapper.properties"
      - ./gradlew --no-daemon --offline --console=plain createReleaseDistributable
      - mkdir -p /app/bin /app/lib
      - cp -r modules/app-desktop/build/compose/binaries/main-release/app/archivekeep-desktop/bin/* /app/bin/
      - cp -r modules/app-desktop/build/compose/binaries/main-release/app/archivekeep-desktop/lib/* /app/lib/
      - |
        # Pre-extract ObjectBox native libraries to /app/lib so the app can find them
        # by searching the directory. Then remove them from the JAR so
        # NativeLibraryLoader's checkUnpackLib finds no resource and skips extraction.
        # Iterate over ALL matching JARs (both x86_64 and arm64) to extract both architectures.
        for OBJECTBOX_JAR in /app/lib/objectbox-linux-*.jar; do
          [ -f "$OBJECTBOX_JAR" ] || continue
          for so in $(unzip -l "$OBJECTBOX_JAR" | grep 'native/libobjectbox-jni-linux-.*\.so' | awk '{print $4}'); do
            basename=$(basename "$so")
            unzip -p "$OBJECTBOX_JAR" "$so" > "/app/lib/$basename"
            chmod 755 "/app/lib/$basename"
          done
          # Remove native .so files from the JAR to prevent NativeLibraryLoader from
          # extracting them to CWD at runtime, which would cause symbol conflicts
          zip -d "$OBJECTBOX_JAR" 'native/libobjectbox-jni-linux-*.so'
        done
      - install -Dm644 modules/app-desktop/src/main/composeResources/drawable/ic_app.svg /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 distribution/resources/$FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -Dm644 distribution/resources/$FLATPAK_ID.desktop /app/share/applications/$FLATPAK_ID.desktop
    sources:
      - type: dir
        path: ../../
        skip:
          - .gradle
          - .github
          - .idea
          - .kotlin
      - type: file
        url: "https://services.gradle.org/distributions/gradle-9.5.1-bin.zip"
        sha256: "bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f"
        dest: "gradle/wrapper"
        dest-filename: "gradle-bin.zip"
      - "gradle-sources.json"
