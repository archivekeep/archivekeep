name: Create Distributables

on:
  workflow_dispatch:

jobs:
  package:
    name: "Package (${{ matrix.architecture }})"
    strategy:
      matrix:
        architecture: [x86_64, aarch64]
        include:
          - architecture: x86_64
            runner: ubuntu-22.04
          - architecture: aarch64
            runner: ubuntu-22.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble
        run: ./gradlew app-desktop:assemble

      - name: Create Release Distributable
        run: ./gradlew app-desktop:createReleaseDistributable

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.architecture }}.AppImage
          chmod +x appimagetool-${{ matrix.architecture }}.AppImage

      - name: Package AppImage
        run: ./bin/package-appimage.sh ./appimagetool-${{ matrix.architecture }}.AppImage ${{ matrix.architecture }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: archivekeep-appimage-${{ matrix.architecture }}
          path: |
            ArchiveKeep-*.AppImage
          retention-days: 7

      - name: Package DEB
        run: ./gradlew app-desktop:packageReleaseDeb

      - name: Upload DEB
        uses: actions/upload-artifact@v6
        with:
          name: archivekeep-deb-${{ matrix.architecture }}
          path: |
            **/*.deb
          retention-days: 7

      - name: Package RPM
        run: ./gradlew app-desktop:packageReleaseRpm

      - name: Upload RPM
        uses: actions/upload-artifact@v6
        with:
          name: archivekeep-rpm-${{ matrix.architecture }}
          path: |
            **/*.rpm
          retention-days: 7
